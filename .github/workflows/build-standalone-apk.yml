name: Build Standalone Android APK

on:
  push:
    paths:
      - '*.jar'
      - '.github/workflows/build-standalone-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Analyze JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find . -maxdepth 1 -type f -iname '*.jar' -print -quit)"
          test -n "$JAR"
          echo "GAME_JAR=$JAR" >> "$GITHUB_ENV"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' > /tmp/MANIFEST.MF
          MIDLET1="$(grep -i '^MIDlet-1:' /tmp/MANIFEST.MF | head -1 | sed 's/^[^:]*:[[:space:]]*//')"
          MIDLET_CLASS="$(printf '%s' "$MIDLET1" | awk -F',' '{gsub(/^ +| +$/, "", $NF); print $NF}')"
          test -n "$MIDLET_CLASS"
          echo "MIDLET_CLASS=$MIDLET_CLASS" >> "$GITHUB_ENV"
          echo "MIDlet class: $MIDLET_CLASS"
          cat /tmp/MANIFEST.MF

      - name: Prepare J2ME runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/nikita36078/J2ME-Loader.git runtime
          mkdir -p runtime/app/src/midlet/libs runtime/app/src/midlet/resources/MIDLET-META-INF
          cp "$GAME_JAR" runtime/app/src/midlet/libs/game.jar
          cp /tmp/MANIFEST.MF runtime/app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF

      - name: Configure standalone runtime and controls
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/build.gradle')
          s = p.read_text()
          if "src/midlet/libs/game.jar" not in s:
              s = s.replace("dependencies {\n", "dependencies {\n    implementation files('src/midlet/libs/game.jar')\n", 1)
          s = re.sub(r'\n\s*signingConfigs\s*\{.*?\n\s*\}\n\s*\n\s*buildTypes', '\n\n    buildTypes', s, count=1, flags=re.S)
          s = re.sub(r'\n\s*signingConfig\s+signingConfigs\.release', '', s)
          p.write_text(s)

          p = Path('app/src/main/java/javax/microedition/shell/MicroLoader.java')
          s = p.read_text()
          old = '''\tpublic boolean init() {\n\t\tFile config = new File(workDir + Config.MIDLET_CONFIGS_DIR + appDirName);\n\t\tthis.params = ProfilesManager.loadConfig(config);\n\t\tif (params == null) {\n\t\t\treturn false;\n\t\t}\n'''
          new = '''\tpublic boolean init() {\n\t\tif (BuildConfig.FULL_EMULATOR) {\n\t\t\tFile config = new File(workDir + Config.MIDLET_CONFIGS_DIR + appDirName);\n\t\t\tthis.params = ProfilesManager.loadConfig(config);\n\t\t\tif (params == null) return false;\n\t\t} else {\n\t\t\tthis.params = new ProfileModel(new File(workDir + Config.MIDLET_CONFIGS_DIR + appDirName));\n\t\t\tthis.params.screenWidth = 240;\n\t\t\tthis.params.screenHeight = 320;\n\t\t\t// Stretch the 240x320 game to the entire physical display.\n\t\t\tthis.params.screenScaleType = 2;\n\t\t\tthis.params.screenScaleRatio = 100;\n\t\t\tthis.params.screenGravity = 2;\n\t\t\tthis.params.orientation = 2;\n\t\t\tthis.params.forceFullscreen = true;\n\t\t\t// Disable the stock phone keyboard for this build. Touch controls will be added separately later.\n\t\t\tthis.params.showKeyboard = false;\n\t\t\tthis.params.touchInput = true;\n\t\t}\n'''
          if old not in s: raise SystemExit('MicroLoader init block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/src/main/java/javax/microedition/shell/MicroActivity.java')
          s = p.read_text()
          old = '''\t\tsetContentView(view);\n\t\tsetSupportActionBar(binding.toolbar);'''
          new = '''\t\tsetContentView(view);\n\t\tsetSupportActionBar(binding.toolbar);\n\t\tforceImmersiveFullscreen();'''
          if old not in s: raise SystemExit('MicroActivity content setup not found')
          s = s.replace(old, new, 1)
          old = '''\t@Override\n\tpublic void onWindowFocusChanged(boolean hasFocus) {\n\t\tsuper.onWindowFocusChanged(hasFocus);\n\t\tif (hasFocus && Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT &&\n\t\t\t\tcurrent instanceof Canvas) {\n\t\t\thideSystemUI();\n\t\t}\n\t}\n'''
          new = '''\t@Override\n\tpublic void onWindowFocusChanged(boolean hasFocus) {\n\t\tsuper.onWindowFocusChanged(hasFocus);\n\t\tif (hasFocus && !BuildConfig.FULL_EMULATOR) {\n\t\t\tforceImmersiveFullscreen();\n\t\t} else if (hasFocus && Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT && current instanceof Canvas) {\n\t\t\thideSystemUI();\n\t\t}\n\t}\n\n\tprivate void forceImmersiveFullscreen() {\n\t\tgetWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);\n\t\tif (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {\n\t\t\tgetWindow().setNavigationBarContrastEnforced(false);\n\t\t}\n\t\tif (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {\n\t\t\tgetWindow().getDecorView().setSystemUiVisibility(\n\t\t\t\t\tView.SYSTEM_UI_FLAG_IMMERSIVE_STICKY\n\t\t\t\t\t| View.SYSTEM_UI_FLAG_FULLSCREEN\n\t\t\t\t\t| View.SYSTEM_UI_FLAG_HIDE_NAVIGATION\n\t\t\t\t\t| View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN\n\t\t\t\t\t| View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION\n\t\t\t\t\t| View.SYSTEM_UI_FLAG_LAYOUT_STABLE);\n\t\t}\n\t}\n'''
          if old not in s: raise SystemExit('MicroActivity focus block not found')
          s = s.replace(old, new, 1)
          old = '''\t\tif (!microLoader.init()) {\n\t\t\tConfig.startApp(this, appName, appPath, true, arguments);\n\t\t\tfinish();\n\t\t\treturn;\n\t\t}\n'''
          new = '''\t\tif (!microLoader.init()) {\n\t\t\tif (BuildConfig.FULL_EMULATOR) Config.startApp(this, appName, appPath, true, arguments);\n\t\t\tfinish();\n\t\t\treturn;\n\t\t}\n'''
          if old not in s: raise SystemExit('MicroActivity fallback block not found')
          s = s.replace(old, new, 1)
          old = '''\t\tif (size == 0) {\n\t\t\tthrow new Exception("No MIDlets found");\n\t\t} else if (size == 1) {\n\t\t\tMidletThread.create(microLoader, midletsClassArray[0]);\n\t\t} else {\n\t\t\tshowMidletDialog(midletsNameArray, midletsClassArray);\n\t\t}\n'''
          new = '''\t\tif (size == 0) {\n\t\t\tthrow new Exception("No MIDlets found");\n\t\t} else if (!BuildConfig.FULL_EMULATOR || size == 1) {\n\t\t\tMidletThread.create(microLoader, midletsClassArray[0]);\n\t\t} else {\n\t\t\tshowMidletDialog(midletsNameArray, midletsClassArray);\n\t\t}\n'''
          if old not in s: raise SystemExit('MicroActivity MIDlet selection block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/src/midlet/AndroidManifest.xml')
          s = p.read_text()
          if 'android:screenOrientation="portrait"' not in s:
              s = s.replace('android:exported="true"', 'android:exported="true" android:screenOrientation="portrait"', 1)
          p.write_text(s)
          PY

          test -f app/src/main/java/javax/microedition/shell/MicroActivity.java
          test -f app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF
          test -f app/src/midlet/libs/game.jar
          grep -q "buildConfigField 'boolean', 'FULL_EMULATOR', 'false'" app/build.gradle
          grep -q 'MIDlet-1:' app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF
          grep -q 'screenScaleType = 2' app/src/main/java/javax/microedition/shell/MicroLoader.java
          grep -q 'screenScaleRatio = 100' app/src/main/java/javax/microedition/shell/MicroLoader.java
          grep -q 'showKeyboard = false' app/src/main/java/javax/microedition/shell/MicroLoader.java

      - name: Build standalone APK
        working-directory: runtime
        shell: bash
        run: bash ./gradlew --no-daemon :app:assembleMidletDebug --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find runtime/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/Snake-Reloaded-standalone.apk
          test -s dist/Snake-Reloaded-standalone.apk
          ls -lh dist/Snake-Reloaded-standalone.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Reloaded-standalone-APK
          path: dist/Snake-Reloaded-standalone.apk
          if-no-files-found: error
