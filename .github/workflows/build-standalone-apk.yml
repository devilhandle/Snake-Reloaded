name: Build Standalone Android APK

on:
  push:
    paths:
      - '*.jar'
      - 'standalone/**'
      - '.github/workflows/build-standalone-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare J2ME runtime
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find . -maxdepth 1 -type f -iname '*.jar' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' > /tmp/MANIFEST.MF
          grep -qi '^MIDlet-1:' /tmp/MANIFEST.MF
          git clone --depth 1 https://github.com/nikita36078/J2ME-Loader.git runtime
          mkdir -p runtime/app/src/midlet/libs runtime/app/src/midlet/resources/MIDLET-META-INF
          cp "$JAR" runtime/app/src/midlet/libs/game.jar
          cp /tmp/MANIFEST.MF runtime/app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF
          cp standalone/StandaloneTouchControls.java runtime/app/src/main/java/javax/microedition/shell/StandaloneTouchControls.java

      - name: Configure standalone portrait mode
        run: python3 standalone/patch_runtime.py

      - name: Build APK
        working-directory: runtime
        run: bash ./gradlew --no-daemon :app:assembleMidletDebug --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find runtime/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/Snake-Reloaded-standalone.apk
          test -s dist/Snake-Reloaded-standalone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Snake-Reloaded-standalone-APK
          path: dist/Snake-Reloaded-standalone.apk
          if-no-files-found: error
