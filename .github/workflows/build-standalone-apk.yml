name: Build Standalone Android APK

on:
  push:
    paths:
      - '*.jar'
      - 'standalone/**'
      - '.github/workflows/build-standalone-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find . -maxdepth 1 -type f -iname '*.jar' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' > /tmp/MANIFEST.MF
          MIDLET1="$(grep -i '^MIDlet-1:' /tmp/MANIFEST.MF | head -1 | sed 's/^[^:]*:[[:space:]]*//')"
          MIDLET_CLASS="$(printf '%s' "$MIDLET1" | awk -F',' '{gsub(/^ +| +$/, "", $NF); print $NF}')"
          test -n "$MIDLET_CLASS"
          echo "MIDLET_CLASS=$MIDLET_CLASS" >> "$GITHUB_ENV"
          git clone --depth 1 https://github.com/nikita36078/J2ME-Loader.git runtime
          mkdir -p runtime/app/src/midlet/libs runtime/app/src/midlet/resources/MIDLET-META-INF
          cp "$JAR" runtime/app/src/midlet/libs/game.jar
          cp /tmp/MANIFEST.MF runtime/app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF
          cp standalone/StandaloneTouchControls.java runtime/app/src/main/java/javax/microedition/shell/StandaloneTouchControls.java

      - name: Configure standalone portrait fullscreen
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Use the supplied JAR directly and use the debug build so no signing
          # secret or release keystore is required.
          p = Path('app/build.gradle')
          s = p.read_text()
          if "src/midlet/libs/game.jar" not in s:
              s = s.replace("dependencies {\n", "dependencies {\n    implementation files('src/midlet/libs/game.jar')\n", 1)
          s = re.sub(r'\n\s*signingConfigs\s*\{.*?\n\s*\}\n\s*\nbuildTypes', '\n\n    buildTypes', s, count=1, flags=re.S)
          s = re.sub(r'\n\s*signingConfig\s+signingConfigs\.release', '', s)
          p.write_text(s)

          # Force the original 240x320 J2ME canvas to stay portrait. The Android
          # activity hides system UI, so the portrait game fills the whole screen.
          p = Path('app/src/main/java/javax/microedition/shell/MicroLoader.java')
          s = p.read_text()
          old = '''\tpublic boolean init() {
\t\tFile config = new File(workDir + Config.MIDLET_CONFIGS_DIR + appDirName);
\t\tthis.params = ProfilesManager.loadConfig(config);
\t\tif (params == null) {
\t\t\treturn false;
\t\t}
'''
          new = '''\tpublic boolean init() {
\t\tif (BuildConfig.FULL_EMULATOR) {
\t\t\tFile config = new File(workDir + Config.MIDLET_CONFIGS_DIR + appDirName);
\t\t\tthis.params = ProfilesManager.loadConfig(config);
\t\t\tif (params == null) return false;
\t\t} else {
\t\t\tthis.params = new ProfileModel(new File(workDir + Config.MIDLET_CONFIGS_DIR + appDirName));
\t\t\tthis.params.screenWidth = 240;
\t\t\tthis.params.screenHeight = 320;
\t\t\tthis.params.screenScaleType = 2;
\t\t\tthis.params.screenScaleRatio = 100;
\t\t\tthis.params.screenGravity = 2;
\t\t\tthis.params.orientation = 2;
\t\t\tthis.params.forceFullscreen = true;
\t\t\tthis.params.showKeyboard = false;
\t\t\tthis.params.touchInput = true;
\t\t}
'''
          if old not in s:
              raise SystemExit('MicroLoader init block not found')
          p.write_text(s.replace(old, new, 1))

          # Add the transparent control overlay. It only consumes touches over
          # its buttons, leaving the game canvas untouched everywhere else.
          p = Path('app/src/main/java/javax/microedition/shell/MicroActivity.java')
          s = p.read_text()
          marker = '\t\tsetContentView(view);\n\t\tsetSupportActionBar(binding.toolbar);'
          repl = marker + '''
\t\tif (!BuildConfig.FULL_EMULATOR) {
\t\t\tandroid.view.ViewGroup root = (android.view.ViewGroup) binding.getRoot();
\t\t\tStandaloneTouchControls controls = new StandaloneTouchControls(this);
\t\t\troot.addView(controls, new android.view.ViewGroup.LayoutParams(-1, -1));
\t\t}'''
          if marker not in s:
              raise SystemExit('MicroActivity setup not found')
          p.write_text(s.replace(marker, repl, 1))

          # Verify that the old landscape/rotation hack is not being applied.
          test "$(grep -c 'this.params.orientation = 2;' app/src/main/java/javax/microedition/shell/MicroLoader.java)" -eq 1
          grep -q 'this.params.forceFullscreen = true;' app/src/main/java/javax/microedition/shell/MicroLoader.java
          grep -q 'StandaloneTouchControls' app/src/main/java/javax/microedition/shell/MicroActivity.java
          grep -q 'KEYCODE_DPAD_UP' app/src/main/java/javax/microedition/shell/StandaloneTouchControls.java
          grep -q 'KEYCODE_DPAD_DOWN' app/src/main/java/javax/microedition/shell/StandaloneTouchControls.java
          grep -q 'KEYCODE_DPAD_LEFT' app/src/main/java/javax/microedition/shell/StandaloneTouchControls.java
          grep -q 'KEYCODE_DPAD_RIGHT' app/src/main/java/javax/microedition/shell/StandaloneTouchControls.java
          grep -q 'KEYCODE_5' app/src/main/java/javax/microedition/shell/StandaloneTouchControls.java
          grep -q 'MIDlet-1:' app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF
          if grep -q 'rotatedSrcAspect' app/src/main/java/javax/microedition/lcdui/Canvas.java; then
            echo 'Unexpected landscape rotation patch detected'
            exit 1
          fi

      - name: Build APK
        working-directory: runtime
        run: bash ./gradlew --no-daemon :app:assembleMidletDebug --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find runtime/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/Snake-Reloaded-standalone.apk
          test -s dist/Snake-Reloaded-standalone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Snake-Reloaded-standalone-APK
          path: dist/Snake-Reloaded-standalone.apk
          if-no-files-found: error
