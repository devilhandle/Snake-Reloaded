name: Build Standalone Android APK

on:
  push:
    paths:
      - '*.jar'
      - 'standalone/**'
      - '.github/workflows/build-standalone-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find . -maxdepth 1 -type f -iname '*.jar' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' > /tmp/MANIFEST.MF
          MIDLET1="$(grep -i '^MIDlet-1:' /tmp/MANIFEST.MF | head -1 | sed 's/^[^:]*:[[:space:]]*//')"
          MIDLET_CLASS="$(printf '%s' "$MIDLET1" | awk -F',' '{gsub(/^ +| +$/, "", $NF); print $NF}')"
          test -n "$MIDLET_CLASS"
          echo "MIDLET_CLASS=$MIDLET_CLASS" >> "$GITHUB_ENV"
          git clone --depth 1 https://github.com/nikita36078/J2ME-Loader.git runtime
          mkdir -p runtime/app/src/midlet/libs runtime/app/src/midlet/resources/MIDLET-META-INF
          cp "$JAR" runtime/app/src/midlet/libs/game.jar
          cp /tmp/MANIFEST.MF runtime/app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF

      - name: Configure standalone, landscape fullscreen and controls
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('app/build.gradle'); s=p.read_text()
          if "src/midlet/libs/game.jar" not in s:
              s=s.replace("dependencies {\n", "dependencies {\n    implementation files('src/midlet/libs/game.jar')\n", 1)
          s=re.sub(r'\n\s*signingConfigs\s*\{.*?\n\s*\}\n\s*\n\s*buildTypes', '\n\n    buildTypes', s, count=1, flags=re.S)
          s=re.sub(r'\n\s*signingConfig\s+signingConfigs\.release', '', s)
          p.write_text(s)

          p=Path('app/src/main/java/javax/microedition/shell/MicroLoader.java'); s=p.read_text()
          old='''\tpublic boolean init() {\n\t\tFile config = new File(workDir + Config.MIDLET_CONFIGS_DIR + appDirName);\n\t\tthis.params = ProfilesManager.loadConfig(config);\n\t\tif (params == null) {\n\t\t\treturn false;\n\t\t}\n'''
          new='''\tpublic boolean init() {\n\t\tif (BuildConfig.FULL_EMULATOR) {\n\t\t\tFile config = new File(workDir + Config.MIDLET_CONFIGS_DIR + appDirName);\n\t\t\tthis.params = ProfilesManager.loadConfig(config);\n\t\t\tif (params == null) return false;\n\t\t} else {\n\t\t\tthis.params = new ProfileModel(new File(workDir + Config.MIDLET_CONFIGS_DIR + appDirName));\n\t\t\tthis.params.screenWidth=240; this.params.screenHeight=320;\n\t\t\tthis.params.screenScaleType=2; this.params.screenScaleRatio=100;\n\t\t\tthis.params.screenGravity=2; this.params.orientation=3;\n\t\t\tthis.params.forceFullscreen=true; this.params.showKeyboard=false; this.params.touchInput=true;\n\t\t}\n'''
          if old not in s: raise SystemExit('MicroLoader block not found')
          p.write_text(s.replace(old,new,1))

          controls='''package javax.microedition.shell;\n\nimport android.content.Context;\nimport android.graphics.Canvas;\nimport android.graphics.Paint;\nimport android.view.KeyEvent;\nimport android.view.MotionEvent;\nimport android.view.View;\n\npublic final class StandaloneTouchControls extends View {\n    private final Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);\n    private float joyX,joyY,knobX,knobY,radius;\n    private int joyKey=0;\n    private boolean fiveDown=false;\n    private final float d;\n    public StandaloneTouchControls(Context c){ super(c); d=getResources().getDisplayMetrics().density; setFocusable(false); p.setColor(0xFFFFFFFF); p.setStrokeWidth(2*d); }\n    private int keyFor(float dx,float dy){ if(Math.abs(dx)<radius*.22f && Math.abs(dy)<radius*.22f) return 0; return Math.abs(dx)>Math.abs(dy)?(dx<0?KeyEvent.KEYCODE_DPAD_LEFT:KeyEvent.KEYCODE_DPAD_RIGHT):(dy<0?KeyEvent.KEYCODE_DPAD_UP:KeyEvent.KEYCODE_DPAD_DOWN); }\n    private void send(int action,int key){ if(key!=0) getRootView().dispatchKeyEvent(new KeyEvent(action,key)); }\n    private boolean inJoy(float x,float y){ float dx=x-joyX,dy=y-joyY; return dx*dx+dy*dy<=radius*radius*2.0f; }\n    private boolean inFive(float x,float y){ float fx=getWidth()*.88f, fy=getHeight()*.78f; float rr=radius*.55f,dx=x-fx,dy=y-fy; return dx*dx+dy*dy<=rr*rr; }\n    @Override protected void onSizeChanged(int w,int h,int ow,int oh){ radius=Math.max(52*d,Math.min(w,h)*.105f); joyX=w*.12f; joyY=h*.78f; knobX=joyX; knobY=joyY; }\n    @Override protected void onDraw(Canvas c){ super.onDraw(c); p.setColor(0xFFFFFFFF); p.setStyle(Paint.Style.STROKE); p.setStrokeWidth(2*d); p.setAlpha(100); c.drawCircle(joyX,joyY,radius,p); p.setStyle(Paint.Style.FILL); p.setAlpha(175); c.drawCircle(knobX,knobY,radius*.42f,p); p.setAlpha(210); c.drawCircle(getWidth()*.88f,getHeight()*.78f,radius*.55f,p); p.setAlpha(255); p.setTextSize(radius*.38f); p.setTextAlign(Paint.Align.CENTER); c.drawText("5",getWidth()*.88f,getHeight()*.78f+radius*.13f,p); }\n    @Override public boolean onTouchEvent(MotionEvent e){ float x=e.getX(),y=e.getY(); if(inJoy(x,y)){ if(e.getAction()==MotionEvent.ACTION_UP||e.getAction()==MotionEvent.ACTION_CANCEL){ send(KeyEvent.ACTION_UP,joyKey); joyKey=0; knobX=joyX; knobY=joyY; invalidate(); return true; } float dx=x-joyX,dy=y-joyY,len=(float)Math.hypot(dx,dy); if(len>radius){dx=dx/len*radius;dy=dy/len*radius;} knobX=joyX+dx; knobY=joyY+dy; int k=keyFor(dx,dy); if(k!=joyKey){ send(KeyEvent.ACTION_UP,joyKey); joyKey=k; send(KeyEvent.ACTION_DOWN,joyKey); } invalidate(); return true; } if(inFive(x,y)){ if(e.getAction()==MotionEvent.ACTION_DOWN && !fiveDown){ fiveDown=true; send(KeyEvent.ACTION_DOWN,KeyEvent.KEYCODE_5); invalidate(); return true; } if((e.getAction()==MotionEvent.ACTION_UP||e.getAction()==MotionEvent.ACTION_CANCEL)&&fiveDown){ fiveDown=false; send(KeyEvent.ACTION_UP,KeyEvent.KEYCODE_5); invalidate(); return true; } } return false; }\n}\n'''
          Path('app/src/main/java/javax/microedition/shell/StandaloneTouchControls.java').write_text(controls)

          p=Path('app/src/main/java/javax/microedition/shell/MicroActivity.java'); s=p.read_text()
          marker='\t\tsetContentView(view);\n\t\tsetSupportActionBar(binding.toolbar);'
          repl=marker+'\n\t\tif (!BuildConfig.FULL_EMULATOR) {\n\t\t\t((android.view.ViewGroup) binding.getRoot()).addView(new StandaloneTouchControls(this), new android.view.ViewGroup.LayoutParams(-1,-1));\n\t\t}'
          if marker not in s: raise SystemExit('MicroActivity setup not found')
          s=s.replace(marker,repl,1)
          p.write_text(s)

          p=Path('app/src/main/res/layout/activity_micro.xml')
          if p.exists(): p.write_text(p.read_text())
          PY

          grep -q "screenScaleType=2" app/src/main/java/javax/microedition/shell/MicroLoader.java
          grep -q "orientation=3" app/src/main/java/javax/microedition/shell/MicroLoader.java
          grep -q "StandaloneTouchControls" app/src/main/java/javax/microedition/shell/MicroActivity.java
          test -f app/src/main/java/javax/microedition/shell/StandaloneTouchControls.java
          grep -q 'MIDlet-1:' app/src/main/midlet/resources/MIDLET-META-INF/MANIFEST.MF

      - name: Build APK
        working-directory: runtime
        run: bash ./gradlew --no-daemon :app:assembleMidletDebug --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find runtime/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/Snake-Reloaded-standalone.apk
          test -s dist/Snake-Reloaded-standalone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Snake-Reloaded-standalone-APK
          path: dist/Snake-Reloaded-standalone.apk
          if-no-files-found: error
