name: Build Standalone Android APK

on:
  push:
    paths:
      - '*.jar'
      - 'standalone/**'
      - '.github/workflows/build-standalone-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare J2ME runtime
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find . -maxdepth 1 -type f -iname '*.jar' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' > /tmp/MANIFEST.MF
          grep -qi '^MIDlet-1:' /tmp/MANIFEST.MF
          git clone --depth 1 https://github.com/nikita36078/J2ME-Loader.git runtime
          mkdir -p runtime/app/src/midlet/libs runtime/app/src/midlet/resources/MIDLET-META-INF
          cp "$JAR" runtime/app/src/midlet/libs/game.jar
          cp /tmp/MANIFEST.MF runtime/app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF
          cp standalone/StandaloneTouchControls.java runtime/app/src/main/java/javax/microedition/shell/StandaloneTouchControls.java

      - name: Install requested game icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/app/src/main/res/drawable
          cp standalone/icon.png runtime/app/src/main/res/drawable/snake_game_icon.png
          test -s runtime/app/src/main/res/drawable/snake_game_icon.png
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('runtime/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          m = re.search(r'<application\b([^>]*)>', s, re.S)
          if not m:
              raise SystemExit('AndroidManifest.xml: <application> tag not found')
          attrs = re.sub(r'\s+android:(?:roundIcon|icon)\s*=\s*"[^"]*"', '', m.group(1))
          attrs = ' android:icon="@drawable/snake_game_icon" android:roundIcon="@drawable/snake_game_icon"' + attrs
          s = s[:m.start(1)] + attrs + s[m.end(1):]
          p.write_text(s)
          PY

      - name: Configure standalone portrait mode
        run: python3 standalone/patch_runtime.py

      - name: Build APK
        working-directory: runtime
        run: bash ./gradlew --no-daemon :app:assembleMidletDebug --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find runtime/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/Snake-Reloaded-standalone.apk
          test -s dist/Snake-Reloaded-standalone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Snake-Reloaded-standalone-APK
          path: dist/Snake-Reloaded-standalone.apk
          if-no-files-found: error

# Rebuild after the exact uploaded icon was installed.
